services:
  mock-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3003:80"
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      - vckit-api
      - storage-service
      - identity-resolver-service
      - mock-global-gs1-resolver
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      # Mount app-config.json for runtime configuration if needed
      - ./app-config.json:/app/app-config.json:ro
    networks:
      - default

networks:
  default:
    name: untp-demo